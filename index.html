<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>://kismat</title>
  
  <link rel="icon" type="image/x-icon" href="faviik.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

  :root {
    --void: #050805;
    --panel: #0a120a;
    --panel-edge: #1c3a1c;
    --neon: #39ff6a;
    --neon-dim: #1c8f3a;
    --neon-bright: #a6ffbf;
    --neon-glow: rgba(57, 255, 106, 0.55);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:#061006;
    font-family: 'Share Tech Mono', monospace;
    color: var(--neon);
    padding: 24px;
    overflow: hidden;
    perspective: 1200px;
  }

  /* scanlines */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    mix-blend-mode: multiply;
    opacity: 0.7;
  }

  /* subtle flicker */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 49;
    background: var(--neon-glow);
    opacity: 0;
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 0.02; }
    98% { opacity: 0; }
    99% { opacity: 0.015; }
  }

  .box {
    position: relative;
    width: 100%;
    max-width: 550px;
    margin: 0 auto;
    padding: 32px 26px 26px;
    background: #061006;
    border: 2px solid var(--neon-dim);
    border-radius: 4px;
    text-align: left;
  }

  .box::before,
  .box::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border: 1px solid var(--neon);
    opacity: 0.7;
  }
  .box::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .box::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-family: 'VT323', monospace;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--neon-bright);
  }

  .titlebar .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon-glow);
    margin-right: 8px;
    animation: blink 1.4s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0.25; }
  }

  .titlebar .rec {
    font-size: 13px;
    color: var(--neon-dim);
  }

  /* ---- 3D Portrait Panel ---- */
  .portrait-stage {
    width: 100%;
    height: 148px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    transform-style: preserve-3d;
    perspective: 900px;
  }

  .portrait-card {
    position: relative;
    width: 170px;
    height: 170px;
    transform-style: preserve-3d;
    margin-bottom: 10px;
  }


  .portrait-face {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: inset;
    background:#061006;
  }

  .portrait-face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.15) contrast(1.05);
    transform: translateZ(0);
  }

  /* scan sweep across the portrait */
  .portrait-face::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateY(-100%);
    animation: scan-sweep 3.4s ease-in-out infinite;
  }

  @keyframes scan-sweep {
    0%   { transform: translateY(-100%); }
    55%  { transform: translateY(100%); }
    100% { transform: translateY(100%); }
  }

  /* the panel's depth edge, gives it a slab thickness */
  .portrait-edge {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #061006;
    transform: translateZ(-14px);
  }

  .portrait-stage::before {
    content: "";
    position: absolute;
    width: 86px;
    height: 14px;
    border-radius: 50%;
    background: var(--neon-glow);
    filter: blur(12px);
    opacity: 0.3;
    transform: translateY(68px);
  }

  .portrait-tag {
    text-align: center;
    margin-top: 8px;
    font-family: 'VT323', monospace;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--neon-dim);
  }

  /* body text */
  .box p.body-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--neon-dim);
    margin: 0 0 20px;
  }

  .box p.body-text::before {
    content: "> ";
    color: var(--neon);
  }

  .divider {
    width: 100%;
    height: 1px;
    background: repeating-linear-gradient(to right, var(--neon-dim) 0, var(--neon-dim) 6px, transparent 6px, transparent 12px);
    opacity: 0.6;
    margin: 0 0 20px;
  }

  /* ---- Play button ---- */
  .player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .play-btn {
    position: relative;
    width: 170px;
    height: 46px;
    border-radius: 23px;
    border: none;
    cursor: pointer;
    background: #061006;
    border: 2px solid #1c8f3a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .play-btn:hover {
    transform: translateY(-1px);

  }

  .play-btn:active {
    transform: translateY(0);

  }

  .play-btn:focus-visible {
    outline: 2px solid var(--neon-bright);
    outline-offset: 4px;
  }

  .icon { position: relative; width: 18px; height: 18px; flex-shrink: 0; }

  .icon .tri {
    position: absolute;
    inset: 0;
    border-style: solid;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent var(--neon-bright);
    margin-left: 3px;
    filter: drop-shadow(0 0 4px var(--neon-glow));
    transition: opacity 0.15s ease;
  }

  .icon .bars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .icon .bars span {
    width: 3px;
    height: 14px;
    background: var(--neon-bright);
    border-radius: 1px;
  }

  .play-btn.is-playing .icon .tri { opacity: 0; }
  .play-btn.is-playing .icon .bars { opacity: 1; }

  .icon .bars span:nth-child(1) { animation: eq 0.9s ease-in-out infinite; }
  .icon .bars span:nth-child(2) { animation: eq 0.9s ease-in-out infinite 0.15s; }
  .icon .bars span:nth-child(3) { animation: eq 0.9s ease-in-out infinite 0.3s; }
  .icon .bars span { animation-play-state: paused; }
  .play-btn.is-playing .icon .bars span { animation-play-state: running; }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.5); }
    50% { transform: scaleY(1); }
  }

  .btn-text {
    font-family: 'VT323', monospace;
    font-size: 16px;
    letter-spacing: 0.14em;
    color: var(--neon-bright);
    text-shadow: 0 0 6px var(--neon-glow);
    white-space: nowrap;
  }

  .status-label {
    font-family: 'VT323', monospace;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--neon-dim);
    min-height: 16px;
  }

  .status-label .track-name {
    color: var(--neon-bright);
    text-shadow: 0 0 6px var(--neon-glow);
  }

  @media (prefers-reduced-motion: reduce) {
    .icon .bars span, .portrait-card, .portrait-face::after, .titlebar .dot {
      animation: none !important;
    }
  }

  @media (max-width: 380px) {
    .box { max-width: 290px; padding: 26px 20px 22px; }
    .box p.body-text { font-size: 12.5px; }
    .portrait-stage { height: 128px; }
    .portrait-card { width: 100px; height: 100px; }
    .play-btn { width: 155px; height: 42px; }
  }
</style>
</head>
<body>

  <div class="box">
    <div class="titlebar">
      <span><span class="dot"></span>SIGNAL://terminal</span>
      <span class="rec">REC●</span>
    </div>

    <div class="portrait-stage">
      <div class="portrait-card">
        <div class="portrait-edge"></div>
        <div class="portrait-face">
          <img src="portrait.png" alt="Portrait" />
        </div>
      </div>
    </div>
    <p class="portrait-tag">KISMAT|CHHETRI</p>

    <p class="body-text">
    Hi there👋 ʕ•ᴥ•ʔ
    </p>
    <p class="body-text">
    I am a full-stacker developer. I turn your ideas💡 into a dgital reality. Let's work🔧 together.
    </p>
    <div class="divider"></div>

    <div class="player">
      <button class="play-btn" id="playBtn" aria-label="Play track" aria-pressed="false">
        <span class="icon">
          <span class="tri"></span>
          <span class="bars"><span></span><span></span><span></span></span>
        </span>
        <span class="btn-text" id="btnText">PLAY_AUDIO</span>
      </button>
      <p class="status-label" id="statusLabel">[ PRESS TO PLAY ]</p>
    </div>

    <audio id="audioTrack" src="a.mp3" preload="none"></audio>

    <script src="https://hamrochatbot.vercel.app/widget.js" data-org="kismat" data-key="92373bcb1baed4c28b3203f4561d4413cbbe4bb92965a1e8"></script>

  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const statusLabel = document.getElementById('statusLabel');
    const btnText = document.getElementById('btnText');
    const audioTrack = document.getElementById('audioTrack');

    playBtn.addEventListener('click', () => {
      if (audioTrack.paused) {
        audioTrack.play();
      } else {
        audioTrack.pause();
      }
    });

    audioTrack.addEventListener('play', () => {
      playBtn.classList.add('is-playing');
      playBtn.setAttribute('aria-label', 'Pause track');
      playBtn.setAttribute('aria-pressed', 'true');
      btnText.textContent = 'PAUSE_AUDIO';
      statusLabel.innerHTML = 'PLAYING :: <span class="track-name">' + (audioTrack.dataset.title || 'TRACK.MP3') + '</span>';
    });

    audioTrack.addEventListener('pause', () => {
      playBtn.classList.remove('is-playing');
      playBtn.setAttribute('aria-label', 'Play track');
      playBtn.setAttribute('aria-pressed', 'false');
      btnText.textContent = 'PLAY_AUDIO';
      statusLabel.textContent = '[ PRESS TO PLAY ]';
    });

    audioTrack.addEventListener('ended', () => {
      playBtn.classList.remove('is-playing');
      playBtn.setAttribute('aria-label', 'Play track');
      playBtn.setAttribute('aria-pressed', 'false');
      btnText.textContent = 'PLAY_AUDIO';
      statusLabel.textContent = '[ PRESS TO PLAY ]';
    });

    audioTrack.addEventListener('error', () => {
      statusLabel.textContent = '[ NO TRACK LOADED ]';
    });
  </script>

  

</body>
</html>
